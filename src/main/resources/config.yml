settings:
  selection-mode: add
  wand-material: WOODEN_SHOVEL
  wand-name: "&aClaim Wand"
  wand-lore:
    - "&7Right click container to set Position 1."
    - "&7Left click container to set Position 2."
  book-title: "SafeChestsX Guide"
  book-author: "SafeChestsX"
  selection-range: 5
  claim-name-min-length: 3
  claim-name-max-length: 24
  claim-name-regex: "^[A-Za-z0-9_-]+$"
  max-claims-per-player: 0
  max-chests-per-claim: 0
  default-virtual-chests: 10
  max-virtual-chests: 0
  virtual-chest-size: 27
  virtual-chest-title: "&8Virtual Chest &7#{index}"
  virtual-chest-price: 1000000
  chestpay-confirm-timeout-ms: 60000
  protect-explosions: true
  protect-pistons: true
  protect-hoppers: true
  allow-wand-craft: false
