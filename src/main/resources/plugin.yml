name: SafeChestsX
version: 1.1.0
main: com.safechestsx.SafeChestsXPlugin
api-version: 1.21
author: SafeChestsX
commands:
  claimchest:
    description: Manage chest claims.
    usage: /claimchest
permissions:
  safechestsx.use:
    description: Access base command.
    default: true
  safechestsx.claim:
    description: Create claims.
    default: true
  safechestsx.trust:
    description: Trust players on a claim.
    default: true
  safechestsx.manage:
    description: Manage existing claims.
    default: true
  safechestsx.admin:
    description: Bypass ownership checks.
    default: op
