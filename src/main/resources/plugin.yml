name: SafeChestsX
version: 4.0.0
main: com.safechestsx.SafeChestsXPlugin
api-version: 1.21
author: SafeChestsX
softdepend:
  - Vault
commands:
  claimchest:
    description: Manage chest claims.
    usage: /claimchest
  chest:
    description: Open virtual chests.
    usage: /chest <number>
  chestpay:
    description: Purchase additional virtual chests.
    usage: /chestpay <amount>
  scxadmin:
    description: SafeChestsX admin tools.
    usage: /scxadmin
  bypasscc:
    description: Bypass a claim for a player.
    usage: /bypasscc <player> <claim>
  unbypasscc:
    description: Remove bypass for a claim.
    usage: /unbypasscc <player> <claim>
permissions:
  safechestsx.use:
    description: Access base command.
    default: true
  safechestsx.claim:
    description: Create claims.
    default: true
  safechestsx.trust:
    description: Trust players on a claim.
    default: true
  safechestsx.manage:
    description: Manage existing claims.
    default: true
  safechestsx.admin:
    description: Bypass ownership checks.
    default: op
  safechestsx.bypass:
    description: Manage claim bypass access.
    default: op
  safechestsx.chest:
    description: Access virtual chests.
    default: true
  safechestsx.chestpay:
    description: Purchase virtual chests.
    default: true
